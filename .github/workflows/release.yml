name: Publish Caddy image with plugins

on:
  push:
    paths:
      - Dockerfile
  repository_dispatch:
    types: [cccaddy-versions-updated]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and republish even if this Caddy version already exists
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/release.yml
      - .github/workflows/update-versions.yml

permissions:
  contents: read

concurrency:
  group: cccaddy-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned versions
        id: versions
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          caddy_version="$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile)"
          if [[ ! "$caddy_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Caddy version: $caddy_version" >&2
            exit 1
          fi

          image="ghcr.io/${IMAGE_OWNER,,}/cccaddy"
          {
            echo "version=$caddy_version"
            echo "minor_version=${caddy_version%.*}"
            echo "major_version=${caddy_version%%.*}"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this Caddy version was published
        id: existing
        env:
          IMAGE: ${{ steps.versions.outputs.image }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch' || inputs.force_rebuild || steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.version }}
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.minor_version }}
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.major_version }}
            ${{ steps.versions.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versions.outputs.version }}
