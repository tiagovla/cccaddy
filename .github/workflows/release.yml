name: Build and publish Caddy with plugins

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable Caddy release
        id: caddy
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          release_tag="$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)"
          version="${release_tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Caddy release tag: $release_tag" >&2
            exit 1
          fi
          minor_version="${version%.*}"
          image="ghcr.io/${IMAGE_OWNER,,}/cccaddy"
          {
            echo "version=$version"
            echo "minor_version=$minor_version"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this Caddy release was published
        id: image
        env:
          IMAGE: ${{ steps.caddy.outputs.image }}
          VERSION: ${{ steps.caddy.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CADDY_VERSION=${{ steps.caddy.outputs.version }}
          tags: |
            ${{ steps.caddy.outputs.image }}:${{ steps.caddy.outputs.version }}
            ${{ steps.caddy.outputs.image }}:${{ steps.caddy.outputs.minor_version }}
            ${{ steps.caddy.outputs.image }}:2
            ${{ steps.caddy.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.caddy.outputs.version }}
